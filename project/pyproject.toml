version = "0.1.0"
description = "Detecção de Intenção Implícita para Ativação de Assistentes de Voz em Ambientes Controlados"
readme = "README.md"
authors = [
    { name = "Phelipe Pereira", email = "phelipe.psouza@senacsp.edu.br" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "google-genai>=0.3.0",
    "mistralai>=1.2.0",
    "tenacity>=9.0.0",
]

[tool.uv]
package = false
