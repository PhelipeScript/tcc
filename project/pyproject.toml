[project]
name = "ddsd"
version = "0.1.0"
description = "DDSD textual em PT-BR: corpus sintético, treino dos classificadores e pipeline em tempo real no macOS"
readme = "README.md"
authors = [{ name = "Phelipe Pereira de Souza" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    # --- núcleo ---
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "requests>=2.32",
    "rich>=15.0",
    "psutil>=7.0",
    # --- treino e avaliação dos classificadores ---
    "torch>=2.14,<2.15",
    "transformers>=5.17,<6",
    "accelerate>=1.10,<2",
    "datasets>=4.0",
    "safetensors>=0.6",
    "scikit-learn>=1.7",
    "matplotlib>=3.9",
    "huggingface-hub>=1.0",
    # --- ASR ---
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper==1.2.1",
    # --- áudio em tempo real ---
    "sounddevice==0.5.6",
    "soxr>=1.0",
    "soundfile>=0.12",
    "silero-vad[onnx-cpu]==6.2.3",
    # --- avaliação de ASR ---
    "jiwer>=4.0",
    "edge-tts>=7.2",
]

[project.scripts]
ddsd = "ddsd.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Pacote `ddsd/` na raiz do projeto, sem `__init__.py` (pacote de namespace).
module-root = ""
namespace = true

[tool.uv]
# Política de versões: só entram versões publicadas há pelo menos
# duas semanas na data em que o ambiente foi montado (01/11/2026). O lock fica
# reprodutível e evita versões recém-lançadas, ainda sem correções.
exclude-newer = "2026-10-18T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "models: exige modelos baixados ou treinados (Whisper, classificadores)",
    "audio_hw: exige dispositivo de áudio real",
    "slow: execução longa (soak, benchmarks)",
    "network: exige acesso à internet",
]
